[project]
name = "pupil-tracker"
version = "1.0.0"
description = "Cross-platform pupil and gaze tracking library with a macOS-specific PySide6 desktop demo."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sage Choi" }]
keywords = ["gaze-tracking", "macos", "mediapipe", "pupil-tracking", "pyside6"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "mediapipe>=0.10",
  "PySide6>=6.6",
  "scikit-learn>=1.4",
  "pyobjc-framework-quartz>=10.0; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.8",
  "ty>=0.0.1a8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pupil_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "apps", "tests", "tools"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.environment]
python-version = "3.11"
python-platform = "macos"
root = ["./src", "./apps", "./tests", "./tools"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
major_on_zero = true
upload_to_pypi = false
commit_message = "{version}\n\n[skip ci]"

[tool.semantic_release.branches.main]
match = "main"
